version: "3.8"

secrets:
  # Optional sandbox/corporate CA bundle for TLS-intercepting proxies. Absent or
  # empty is fine - the Dockerfile only trusts it when the mounted file is non-empty.
  ca_cert:
    file: ../../.certs/ca-bundle.crt

services:
  # Disposable Docker-in-Docker engine for isolated tests
  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-socket:/var/run
    networks:
      - nebulima-net

  # Test runner executing cargo test + vitest against dind socket
  test-runner:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      secrets:
        - ca_cert
    depends_on:
      - dind
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - RUST_BACKTRACE=1
    volumes:
      - ../..:/workspace
      - dind-socket:/var/run
      - node-modules:/workspace/node_modules
      - cargo-target:/workspace/src-tauri/target
    networks:
      - nebulima-net
    command: >
      bash -c "
        set -euo pipefail;
        echo 'Waiting for Docker daemon...';
        while ! docker info >/dev/null 2>&1; do sleep 1; done;
        echo 'Docker daemon ready. Running shell script tests...';
        chmod +x /workspace/scripts/preflight-check.sh /workspace/scripts/preflight-check.test.sh;
        /workspace/scripts/preflight-check.test.sh &&
        echo 'Running backend tests...' &&
        (cd /workspace/src-tauri && cargo test -- --nocapture) &&
        echo 'Running frontend tests...' &&
        (cd /workspace && npm test)
      "

volumes:
  dind-socket:
  # Baked into the image during build; named volumes seed from the image's existing
  # directory content on first use, so these survive the /workspace bind mount above.
  node-modules:
  cargo-target:

networks:
  nebulima-net:
    driver: bridge
