name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # release-please.yml's `force-tag-creation` makes the App create tags
  # directly off main, but this also catches a hand-pushed tag (the `v*` tag ruleset
  # should already block that for non-bypass actors) or a tag whose version fields don't
  # actually agree - bundle filenames are derived from them.
  guard:
    name: Verify tag is on main and versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify ancestry and version fields
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not an ancestor of origin/main. Refusing to release from a commit that isn't on main."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          echo "tag:                 $TAG_VERSION"
          echo "package.json:       $PACKAGE_VERSION"
          echo "tauri.conf.json:    $TAURI_VERSION"
          echo "src-tauri/Cargo.toml: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$PACKAGE_VERSION" != "$TAURI_VERSION" ] || [ "$PACKAGE_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION package.json=$PACKAGE_VERSION tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION"
            exit 1
          fi

  release:
    name: Build & publish (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: deb,appimage
            args: ""
            arch: x86_64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target x86_64-apple-darwin"
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      # rust-toolchain.toml pins the exact release toolchain and already lists every
      # target this matrix needs (aarch64-apple-darwin, x86_64-apple-darwin,
      # x86_64-unknown-linux-gnu), so rustup's override picks it up with no extra args.
      - run: rustup show
      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Without this, the two macos-latest matrix entries (aarch64 vs x86_64) share
          # one default job-based cache key and fight over the same cache entry.
          key: ${{ matrix.arch }}
      - run: npm ci
      - name: Build and attach to release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No releaseName/releaseBody here - the release already exists as a draft
          # (release-please.yml created it with the generated changelog as its body),
          # tauri-action just finds it by tag and uploads bundles into it. releaseDraft
          # must still be set to true though - tauri-action's tagName lookup requires it
          # to match the existing release's actual draft status, otherwise it decides no
          # matching release exists and tries (and fails) to create a new one.
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}

  publish:
    name: Publish the draft release
    needs: [guard, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
