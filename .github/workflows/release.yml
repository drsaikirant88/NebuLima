name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: deb,appimage
            args: ""
            arch: x86_64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target x86_64-apple-darwin"
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only macOS cross-targets a non-host triple; the runner's default toolchain
          # already covers ubuntu-latest's native target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Without this, the two macos-latest matrix entries (aarch64 vs x86_64) share
          # one default job-based cache key and fight over the same cache entry.
          key: ${{ matrix.arch }}
      - run: npm ci
      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NebuLima ${{ github.ref_name }}"
          releaseBody: |
            NebuLima ${{ github.ref_name }}

            macOS and Linux builds are unsigned. On macOS, right-click the app and
            choose "Open" the first time to bypass the Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
