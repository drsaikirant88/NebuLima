name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: deb,appimage
            args: ""
            arch: x86_64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            bundles: dmg,app
            args: "--target x86_64-apple-darwin"
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      # rust-toolchain.toml pins the exact release toolchain and already lists every
      # target this matrix needs (aarch64-apple-darwin, x86_64-apple-darwin,
      # x86_64-unknown-linux-gnu), so rustup's override picks it up with no extra args.
      - run: rustup show
      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Without this, the two macos-latest matrix entries (aarch64 vs x86_64) share
          # one default job-based cache key and fight over the same cache entry.
          key: ${{ matrix.arch }}
      - run: npm ci
      - name: Build and attach to release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NebuLima ${{ github.ref_name }}"
          releaseBody: |
            NebuLima ${{ github.ref_name }}

            macOS and Linux builds are unsigned. On macOS, right-click the app and
            choose "Open" the first time to bypass the Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
