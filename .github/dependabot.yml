version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    groups:
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s-openapi"
    ignore:
      # kube 4.2.0 requires k8s-openapi ^0.28; 0.29 breaks that pin. Remove this once
      # kube's k8s-openapi requirement moves past 0.28 (see src-tauri/Cargo.toml).
      - dependency-name: "k8s-openapi"
